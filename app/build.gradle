plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.globalcalcium.canteenmonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.globalcalcium.canteenmonitor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    // Jetpack Compose & Material 3
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    
    // Coil for Image Loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Retrofit & Coroutines
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    // BUGFIX (Aug-2026): room-compiler was missing entirely -- Room's @Database/@Dao
    // annotations need this to actually generate the real database implementation
    // at build time. Without it, Employee's @Entity annotation existed but nothing
    // in the app ever actually used Room -- everything (employee cache, punch
    // history) was living only in an in-memory HashMap/list the whole time, wiped
    // the moment the process was killed. This is the root cause of the "magic bug".
    kapt 'androidx.room:room-compiler:2.6.1'

    // FEATURE (Aug-2026): direct USB serial input (RS485-to-USB converter into the
    // tablet's USB-C port, no LAN converter in between). Android has no built-in
    // driver for the common USB-serial chipsets (FTDI, CP210x, CH340, PL2303) the
    // way a PC does -- this well-established open-source library talks to the raw
    // USB device and handles the chip-specific protocol, covering all four of the
    // most common ones without needing to know in advance which is inside a given
    // converter.
    // BUGFIX (Aug-2026): 3.7.1 was never a real released version -- confirmed
    // against the project's actual GitHub Releases page (not just a README, which
    // can reference an in-progress version ahead of its real tagged release) that
    // 3.10.0 is the current latest tag JitPack can actually build.
    implementation 'com.github.mik3y:usb-serial-for-android:3.10.0'
}